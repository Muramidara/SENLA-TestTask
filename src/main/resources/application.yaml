spring:
  application:
    name: testProjectSENLA

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/senla_test_task_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    schemas: public
    default-schema: public
    locations: classpath:db/migration
    fail-on-missing-locations: true
    validate-migration-naming: true

#logging:
#  level:
#    org.flywaydb: DEBUG
#    org.springframework.boot.autoconfigure.flyway: DEBUG

binance:
  api:
    base-url: https://api.binance.com
    endpoint: /api/v3/avgPrice
    symbol: BNBUSDT

  scheduling:
    enabled: true
    fixed-delay: ${BINANCE_POLL_INTERVAL:PT5S}
    initial-delay: PT5S
    default-retry-delay: PT5M